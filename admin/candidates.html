<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positions &amp; Candidates | E-CHUNAB Admin</title>
  <meta name="description" content="Manage electoral positions and candidate profiles.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-container">
    <aside class="app-sidebar">
      <div class="sidebar-brand">
        <img src="../assets/images/logo.svg" alt="E-CHUNAB" width="36" height="36">
        <div>
          <div class="brand-text">E-CHUNAB</div>
          <div class="brand-badge">Admin Suite</div>
        </div>
      </div>

      <ul class="sidebar-menu">
        <li class="sidebar-menu-item">
          <a href="dashboard.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="voters.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
            </svg>
            <span>Voters</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="elections.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
            <span>Elections</span>
          </a>
        </li>
        <li class="sidebar-menu-item active">
          <a href="candidates.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
            </svg>
            <span>Candidates</span>
          </a>
        </li>
        <li class="sidebar-menu-item">
          <a href="results.html">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
            <span>Results</span>
          </a>
        </li>
      </ul>

      <div class="sidebar-footer">
        <div class="sidebar-user-card">
          <div class="sidebar-user-avatar" style="background: var(--accent-red-600);">A</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name">Election Officer</div>
            <div class="sidebar-user-role">Administrator</div>
          </div>
          <button class="action-logout" title="Sign Out" style="background:none; border:none; color:var(--gray-400); cursor:pointer; padding:4px;">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle-btn" aria-label="Toggle navigation">
            <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
          <div class="topbar-title">Position &amp; Candidate Management</div>
        </div>

        <div class="topbar-right">
          <button id="btn-add-position" class="btn btn-outline btn-sm">+ New Position</button>
          <button id="btn-add-candidate" class="btn btn-primary btn-sm">+ Nominate Candidate</button>
        </div>
      </header>

      <main class="content-body">
        <!-- Dynamic Positions & Candidates Container -->
        <div id="positions-candidates-container">
          <div style="text-align: center; padding: 40px; color: var(--gray-500);">
            Loading positions and nominated candidates from database...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Candidate Modal (Section 11) -->
  <div class="modal-backdrop" id="candidate-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Nominate New Candidate</h3>
        <button class="modal-close-btn" onclick="closeModal('candidate-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="candidate-form" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="form-label" for="cand-name">Candidate Name <span class="required">*</span></label>
            <input type="text" id="cand-name" class="form-control" placeholder="e.g. Sunil Shrestha" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="cand-party">Party Affiliation <span class="required">*</span></label>
              <input type="text" id="cand-party" class="form-control" placeholder="e.g. Democratic Alliance" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="cand-symbol">Electoral Symbol <span class="required">*</span></label>
              <input type="text" id="cand-symbol" class="form-control" placeholder="e.g. 🕊️ Dove or ⚖️ Scale" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="cand-pos">Target Position <span class="required">*</span></label>
            <select id="cand-pos" class="form-control">
              <option value="pres">President</option>
              <option value="vpres">Vice President</option>
              <option value="sec">General Secretary</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="cand-bio">Biography &amp; Manifesto</label>
            <textarea id="cand-bio" class="form-control" rows="3" placeholder="Brief candidate background..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('candidate-modal')">Cancel</button>
        <button type="button" id="btn-save-candidate" class="btn btn-primary">Save Candidate</button>
      </div>
    </div>
  </div>

  <!-- Position Modal (Section 11) -->
  <div class="modal-backdrop" id="position-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title">Define Contestable Position</h3>
        <button class="modal-close-btn" onclick="closeModal('position-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="position-form" onsubmit="event.preventDefault();">
          <div class="form-group">
            <label class="form-label" for="pos-name">Position Name <span class="required">*</span></label>
            <input type="text" id="pos-name" class="form-control" placeholder="e.g. Treasurer" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="pos-desc">Position Description</label>
            <textarea id="pos-desc" class="form-control" rows="3" placeholder="Duties and scope of authority..."></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('position-modal')">Cancel</button>
        <button type="button" id="btn-save-position" class="btn btn-primary">Create Position</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin/candidates.js"></script>
</body>
</html>
