<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voter Registration | E-CHUNAB</title>
  <meta name="description" content="Register as a verified voter on E-Chunab.">
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-container" style="max-width: 560px;">
      <div class="auth-card">
        <div class="auth-header">
          <div class="auth-logo">
            <a href="../index.html">
              <img src="../assets/images/logo.svg" alt="E-CHUNAB" width="56" height="56">
            </a>
          </div>
          <h1 class="auth-title">Voter Registration</h1>
          <p class="auth-subtitle">Create your digital civic account to participate in upcoming elections</p>
        </div>

        <div style="background: var(--primary-50); border: 1px solid var(--primary-100); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 1.1rem;">ℹ️</span>
          <span style="font-size: 0.8rem; color: var(--primary-700);">All new registrations are created with <strong>Voter</strong> role. Citizenship verification will be required after sign up.</span>
        </div>

        <form id="register-form" onsubmit="event.preventDefault(); handleRegistration();">
          <div class="form-group">
            <label class="form-label" for="reg-fullname">Full Legal Name <span class="required">*</span></label>
            <input type="text" id="reg-fullname" class="form-control" placeholder="e.g. Aarav Sharma" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address <span class="required">*</span></label>
            <input type="email" id="reg-email" class="form-control" placeholder="voter@echunab.gov.np" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Phone Number <span class="required">*</span></label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="+977 98XXXXXXXX" required>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div class="form-group">
              <label class="form-label" for="reg-password">Password <span class="required">*</span></label>
              <input type="password" id="reg-password" class="form-control" placeholder="Min. 8 characters" minlength="8" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-confirm-password">Confirm Password <span class="required">*</span></label>
              <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-type password" minlength="8" required>
            </div>
          </div>

          <div class="form-group" style="margin-top: 24px;">
            <button type="submit" id="btn-register-submit" class="btn btn-primary" style="width: 100%;">
              Create Voter Account
            </button>
          </div>
        </form>

        <div class="auth-divider">
          <span>or</span>
        </div>

        <div class="auth-footer">
          Already registered? <a href="login.html" class="font-bold">Sign In to Portal</a>
          <div style="margin-top: 14px;">
            <a href="../index.html" style="color: var(--gray-500); font-size: 0.8rem;">&larr; Return to Homepage</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    async function handleRegistration() {
      const submitBtn = document.getElementById('btn-register-submit');
      const fullName = document.getElementById('reg-fullname').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm-password').value;

      if (!fullName || !email || !phone || !password) {
        if (window.showToast) showToast('warning', 'Validation', 'Please fill in all required fields.');
        return;
      }

      if (password.length < 8) {
        if (window.showToast) showToast('warning', 'Weak Password', 'Password must be at least 8 characters long.');
        return;
      }

      if (password !== confirmPassword) {
        if (window.showToast) showToast('error', 'Mismatch', 'Passwords do not match. Please re-enter.');
        return;
      }

      const client = window.getSupabaseClient ? window.getSupabaseClient() : null;
      if (!client) {
        if (window.showToast) showToast('error', 'Configuration Error', 'Unable to connect to Supabase authentication.');
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = 'Creating Account...';

      try {
        console.log('[Supabase Auth Diagnostic] Attempting registration for:', email);
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName,
              phone: phone
            }
          }
        });

        console.log('[Supabase Auth Diagnostic] signUp response:', { data, error });

        if (error) {
          throw error;
        }

        // Diagnostic Check: Detect existing registered account (Supabase returns error: null & identities: [])
        if (data.user && data.user.identities && data.user.identities.length === 0) {
          console.warn('[Supabase Auth Diagnostic] User already exists (empty identities array).');
          if (window.showToast) {
            showToast('error', 'Already Registered', 'An account with this email address already exists. Please log in instead.');
          }
          return;
        }

        sessionStorage.setItem('pendingVerificationEmail', email);

        if (window.showToast) {
          showToast('success', 'Account Created', 'Registration successful! Redirecting to email verification...');
        }

        setTimeout(() => {
          window.location.href = 'otp.html';
        }, 1000);

      } catch (err) {
        console.error('[Registration Error Diagnostic]', err);
        let msg = err.message || 'An error occurred during registration.';
        const rawErr = (err.message || '').toLowerCase();
        if (rawErr.includes('already registered') || rawErr.includes('already exists')) {
          msg = 'An account with this email address already exists. Please log in instead.';
        } else if (rawErr.includes('rate limit') || rawErr.includes('over_email_send_rate_limit')) {
          msg = 'Email rate limit exceeded (Built-in Supabase SMTP limit is 3 emails/hour). Please wait before trying again.';
        }
        if (window.showToast) {
          showToast('error', 'Registration Failed', msg);
        }
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    }
  </script>
</body>


</html>
